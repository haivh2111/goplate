# Triggered by pushing a vX.Y.Z tag. Builds the cross-platform binary matrix
# via goreleaser and uploads the archives + checksums to a GitHub Release.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # required so goreleaser can create the GitHub Release

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history → accurate changelog

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
