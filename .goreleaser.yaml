# goreleaser config. Drives the tag-triggered GitHub Actions release pipeline.
# Local equivalents live in the Makefile (`make release` / `make snapshot`).
#
# Sanity-check before tagging: `goreleaser check`.
# Dry-run a build:               `goreleaser release --snapshot --clean --skip=publish`.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: goplate
    main: ./cmd/goplate
    binary: goplate
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/haivh2111/goplate/internal/version.Version={{ .Version }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    name_template: goplate_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*           # included if present (round 5 adds LICENSE/README)
      - README*

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-dev-{{ .ShortCommit }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  draft: false
  prerelease: auto
